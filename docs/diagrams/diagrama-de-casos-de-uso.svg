<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
  <title id="title">Diagrama de casos de uso do StoksMaster</title>
  <desc id="desc">Caso de uso do lojista no sistema StoksMaster.</desc>
  <defs>
    <style>
      text { font-family: "Segoe UI", Arial, sans-serif; fill: #111827; }
      .title { font-size: 24px; font-weight: 700; }
      .actor-name { font-size: 18px; font-weight: 700; text-anchor: middle; }
      .usecase { font-size: 16px; text-anchor: middle; fill: #111827; }
      .system-name { font-size: 17px; font-weight: 700; text-anchor: middle; }
      .line { stroke: #334155; stroke-width: 1.8; fill: none; }
      .include-line { stroke: #334155; stroke-width: 1.8; stroke-dasharray: 7 5; fill: none; }
    </style>
  </defs>

  <rect width="1400" height="900" fill="#ffffff"/>

  <rect x="210" y="0" width="1190" height="900" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  <text class="system-name" x="805" y="36">StoksMaster</text>

  <g class="line">
    <circle cx="70" cy="150" r="16"/>
    <path d="M70 166 V270"/>
    <path d="M70 198 L24 238"/>
    <path d="M70 198 L116 238"/>
    <path d="M70 270 L30 330"/>
    <path d="M70 270 L110 330"/>
  </g>
  <text class="actor-name" x="70" y="354">Lojista</text>

  <g>
    <ellipse cx="390" cy="110" rx="105" ry="38" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
    <text class="usecase" x="390" y="117">Fazer Login</text>

    <ellipse cx="390" cy="190" rx="105" ry="38" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
    <text class="usecase" x="390" y="197">Criar Conta</text>

    <ellipse cx="390" cy="270" rx="130" ry="38" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
    <text class="usecase" x="390" y="277">Visualizar Estatísticas</text>

    <ellipse cx="390" cy="350" rx="105" ry="38" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
    <text class="usecase" x="390" y="357">Fazer Logout</text>

    <ellipse cx="390" cy="500" rx="145" ry="42" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
    <text class="usecase" x="390" y="507">Gerenciar Produtos</text>
  </g>

  <g>
    <ellipse cx="990" cy="260" rx="145" ry="38" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
    <text class="usecase" x="990" y="267">Adicionar Produto</text>

    <ellipse cx="990" cy="350" rx="145" ry="38" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
    <text class="usecase" x="990" y="357">Editar Produto</text>

    <ellipse cx="990" cy="440" rx="145" ry="38" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
    <text class="usecase" x="990" y="447">Remover Produto</text>

    <ellipse cx="990" cy="530" rx="180" ry="42" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
    <text class="usecase" x="990" y="537">Ajustar Quantidade em Estoque</text>

    <ellipse cx="990" cy="620" rx="145" ry="38" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
    <text class="usecase" x="990" y="627">Consultar Histórico</text>

    <ellipse cx="990" cy="710" rx="145" ry="38" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
    <text class="usecase" x="990" y="707">Gerar Relatório</text>
    <text class="usecase" x="990" y="723" font-size="13">Estoque Baixo</text>
  </g>

  <g class="line">
    <path d="M116 198 L285 110"/>
    <path d="M116 198 L285 190"/>
    <path d="M116 198 L260 270"/>
    <path d="M116 198 L285 350"/>
    <path d="M116 198 L245 500"/>
  </g>

  <g class="include-line">
    <path d="M535 500 C620 500 720 260 845 260"/>
    <path d="M535 500 C620 500 720 350 845 350"/>
    <path d="M535 500 C620 500 720 440 845 440"/>
    <path d="M535 500 C620 500 720 530 810 530"/>
    <path d="M535 500 C620 500 720 620 845 620"/>
    <path d="M535 500 C620 500 720 710 845 710"/>
