<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1180" viewBox="0 0 1800 1180" role="img" aria-labelledby="title desc">
  <title id="title">Diagrama de classes do StoksMaster</title>
  <desc id="desc">Classes, atributos e relacionamentos do modelo de dados do StoksMaster.</desc>
  <defs>
    <style>
      text { font-family: "Segoe UI", Arial, sans-serif; fill: #111827; }
      .heading { font-size: 34px; font-weight: 800; }
      .subtitle { font-size: 18px; fill: #64748b; }
      .stereotype { font-size: 13px; fill: #64748b; }
      .class-name { font-size: 23px; font-weight: 800; }
      .field { font-size: 17px; }
      .field-fk { font-size: 17px; fill: #0369a1; }
      .cardinality { font-size: 16px; font-weight: 700; fill: #334155; paint-order: stroke; stroke: #f8fafc; stroke-width: 5px; stroke-linejoin: round; }
      .relation-label { font-size: 15px; fill: #475569; }
      .note-title { font-size: 16px; font-weight: 800; fill: #334155; }
      .note { font-size: 15px; fill: #475569; }
      .box { fill: #ffffff; stroke: #94a3b8; stroke-width: 2; }
      .header { fill: #dbeafe; }
      .divider { stroke: #94a3b8; stroke-width: 1.5; }
      .relation { stroke: #64748b; stroke-width: 2.5; fill: none; }
      .reference { stroke: #7c3aed; stroke-width: 2.5; stroke-dasharray: 10 8; fill: none; }
    </style>
    <marker id="association-arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M1 1 L10 6 L1 11" fill="none" stroke="#64748b" stroke-width="1.8"/>
    </marker>
    <marker id="reference-arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M1 1 L10 6 L1 11" fill="none" stroke="#7c3aed" stroke-width="1.8"/>
    </marker>
  </defs>

  <rect width="1800" height="1180" fill="#f8fafc"/>
  <text class="heading" x="70" y="68">StoksMaster — Diagrama de classes</text>
  <text class="subtitle" x="70" y="102">Modelo de dados do backend · entidades persistidas no banco</text>

  <path class="relation" d="M720 330 L610 390 L550 455 V570 H505" marker-end="url(#association-arrow)"/>
  <text class="cardinality" x="730" y="352">1</text>
  <text class="cardinality" x="545" y="535" text-anchor="end">0..*</text>
  <rect x="548" y="405" width="112" height="25" rx="5" fill="#f8fafc"/>
  <text class="relation-label" x="604" y="423" text-anchor="middle">possui usuários</text>

  <path class="relation" d="M900 330 V415" marker-end="url(#association-arrow)"/>
  <text class="cardinality" x="915" y="350">1</text>
  <text class="cardinality" x="915" y="405">0..*</text>
  <rect x="917" y="365" width="100" height="24" rx="5" fill="#f8fafc"/>
  <text class="relation-label" x="925" y="383">possui</text>

  <path class="relation" d="M1100 240 H1180 Q1200 240 1200 260 V390 Q1200 410 1220 410 H1430 Q1450 410 1450 430 V495" marker-end="url(#association-arrow)"/>
  <text class="cardinality" x="1110" y="232">1</text>
  <text class="cardinality" x="1468" y="485">0..*</text>
  <rect x="1250" y="379" width="173" height="25" rx="5" fill="#f8fafc"/>
  <text class="relation-label" x="1336" y="397" text-anchor="middle">registra movimentos</text>

  <path class="reference" d="M1320 720 H1095" marker-end="url(#reference-arrow)"/>
  <text class="cardinality" x="1305" y="695" text-anchor="end">0..*</text>
  <text class="cardinality" x="1105" y="695">0..1</text>
  <rect x="1135" y="730" width="168" height="24" rx="5" fill="#f8fafc"/>
  <text class="relation-label" x="1219" y="748" text-anchor="middle">referência por product_id</text>

  <g transform="translate(700 150)">
    <rect class="box" rx="12" width="400" height="180"/>
    <path class="header" d="M12 0 H388 Q400 0 400 12 V58 H0 V12 Q0 0 12 0 Z"/>
    <text class="stereotype" x="20" y="22">«entidade»</text>
    <text class="class-name" x="20" y="48">Store / Loja</text>
    <line class="divider" x1="0" y1="58" x2="400" y2="58"/>
    <text class="field" x="20" y="88">+ id : int</text>
    <text class="field" x="20" y="118">+ name : String</text>
    <text class="field" x="20" y="148">+ created_at : datetime</text>
  </g>

  <g transform="translate(70 500)">
    <rect class="box" rx="12" width="430" height="300"/>
    <path class="header" d="M12 0 H418 Q430 0 430 12 V58 H0 V12 Q0 0 12 0 Z"/>
    <text class="stereotype" x="20" y="22">«entidade»</text>
    <text class="class-name" x="20" y="48">User / Usuário</text>
    <line class="divider" x1="0" y1="58" x2="430" y2="58"/>
    <text class="field" x="20" y="88">+ id : int</text>
    <text class="field" x="20" y="118">+ name : String</text>
    <text class="field" x="20" y="148">+ email : String</text>
    <text class="field" x="20" y="178">- hashed_password : String</text>
    <text class="field-fk" x="20" y="208">+ store_id : int «FK»</text>
    <text class="field" x="20" y="238">+ created_at : datetime</text>
  </g>

  <g transform="translate(710 420)">
    <rect class="box" rx="12" width="380" height="380"/>
    <path class="header" d="M12 0 H368 Q380 0 380 12 V58 H0 V12 Q0 0 12 0 Z"/>
    <text class="stereotype" x="20" y="22">«entidade»</text>
    <text class="class-name" x="20" y="48">Product / Produto</text>
    <line class="divider" x1="0" y1="58" x2="380" y2="58"/>
    <text class="field" x="20" y="88">+ id : int</text>
    <text class="field" x="20" y="118">+ name : String</text>
    <text class="field" x="20" y="148">+ image : String? = null</text>
    <text class="field" x="20" y="178">+ category : String</text>
    <text class="field" x="20" y="208">+ price : float</text>
    <text class="field" x="20" y="238">+ quantity : int</text>
    <text class="field-fk" x="20" y="268">+ store_id : int «FK»</text>
    <text class="field" x="20" y="298">+ created_at : datetime</text>
  </g>

  <g transform="translate(1320 500)">
    <rect class="box" rx="12" width="410" height="440"/>
    <path class="header" d="M12 0 H398 Q410 0 410 12 V58 H0 V12 Q0 0 12 0 Z"/>
    <text class="stereotype" x="20" y="22">«entidade»</text>
    <text class="class-name" x="20" y="48">StockMovement</text>
    <line class="divider" x1="0" y1="58" x2="410" y2="58"/>
    <text class="field" x="20" y="88">+ id : int</text>
    <text class="field-fk" x="20" y="118">+ product_id : int «referência»</text>
    <text class="field" x="20" y="148">+ product_name : String</text>
    <text class="field-fk" x="20" y="178">+ store_id : int «FK»</text>
    <text class="field" x="20" y="208">+ movement_type : String</text>
    <text class="field" x="20" y="238">+ quantity_delta : int</text>
    <text class="field" x="20" y="268">+ quantity_before : int</text>
    <text class="field" x="20" y="298">+ quantity_after : int</text>
    <text class="field" x="20" y="328">+ reason : String</text>
    <text class="field" x="20" y="358">+ created_at : datetime</text>
  </g>

  <g transform="translate(70 1020)">
    <rect width="1660" height="120" rx="12" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2"/>
    <text class="note-title" x="22" y="34">Observação importante</text>
    <text class="note" x="22" y="66">StockMovement preserva o nome do produto e as quantidades anterior e posterior.</text>
    <text class="note" x="22" y="96">A ligação com Product é feita pelo campo product_id, usado como referência histórica sem chave estrangeira.</text>
  </g>
</svg>
